[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Staging / deploy previews: keep out of search engines (default in the app).
[context.production.environment]
  # Set to "true" ONLY when the real domain is live and ready to be indexed.
  NEXT_PUBLIC_SITE_INDEXABLE = "false"
  NEXT_PUBLIC_SITE_URL = "https://allfresh512.com"
